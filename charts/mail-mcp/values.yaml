image:
  registry: ghcr.io
  repository: excavador/mail-mcp
  # Empty means the chart's appVersion. Pin it in a values file to upgrade
  # deliberately rather than whenever the chart is republished.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# A Secret holding accounts.yaml plus one key per password file.
# Mount it read-only at /etc/mail-mcp with ACCOUNTS_FILE=/etc/mail-mcp/accounts.yaml
#
# The accounts file is not rendered from these values, so owner aliases live in
# that Secret's accounts.yaml, per account (see the README, "Owner aliases"):
#
#   accounts:
#     - name: proton-main
#       ...
#       aliases:
#         - me@example.com     # exact address (plus-tags match too)
#         - "@example.org"     # any address at this domain
#
# Calendar (Google Workspace accounts only; see the README, "Calendar
# (Google)"): the same Secret also carries the OAuth client id, client secret
# and refresh token as one key each, and the account's `calendar:` section
# names them under /etc/mail-mcp. No chart value is needed: the whole Secret
# is mounted, so adding keys to it (and Reloader, via deploymentAnnotations)
# is all it takes.
#
#       calendar:
#         provider: google
#         clientIdFile: /etc/mail-mcp/gmail-truvity-calendar-client-id
#         clientSecretFile: /etc/mail-mcp/gmail-truvity-calendar-client-secret
#         refreshTokenFile: /etc/mail-mcp/gmail-truvity-calendar-refresh-token
#         write: true    # preview_event / create_event; needs calendar-login --write
accounts:
  # Required. The accounts file and password files are never literals in values:
  # they would end up in a values file, in git, and in `helm get values` output.
  existingSecret: ""

# stdio is meaningless in a pod, so this chart only ever runs http.
#
# The pod has three containers, or four with pdfExtractor:
#
#   mail-mcp     serves MCP on 127.0.0.1:8081 (/mcp read, /mcp-admin admin).
#                It declares no container port for MCP and holds no
#                authentication code; it refuses a non-loopback address. Its
#                ops port (9090, /healthz only) is for the kubelet.
#   proxy-read   a sluis resource-proxy: the read resource's MCP port (8080).
#   proxy-admin  a second resource-proxy: the admin resource's port (8082).
#                One proxy handles exactly one resource, so two resources are
#                two proxies. Each validates the caller's access token
#                (signature against the issuer's keys, `iss`, and `aud` equal
#                to ITS resource URL), serves the RFC 9728 protected-resource
#                metadata, writes one audit line per request, strips the
#                Authorization header and forwards to mail-mcp on loopback. A
#                token for the read resource fails the admin proxy's `aud`
#                check, so it never reaches the write tools.
#   pdftext      optional, see pdfExtractor.
#
# Who may call is the issuer's policy for each resource URL, not anything here.
service:
  type: ClusterIP
  # The Service's two ports. They target the proxies by name, so these
  # numbers are free; the container ports are fixed (8080 and 8082).
  port: 8080       # the read proxy
  adminPort: 8082  # the admin proxy

# What the proxies validate against. All of issuerUrl, readResourceUrl and
# adminResourceUrl are required.
auth:
  # The issuer's own URL, exactly as it appears in a token's `iss`. https, no
  # fragment.
  issuerUrl: ""
  # The read endpoint's own EXTERNAL URL (not its in-cluster Service address):
  # the RFC 8707 resource indicator a client names, and the `aud` the proxy
  # requires. Must equal, byte for byte, this resource's id in the issuer's
  # policy AND the public URL clients are given. https, with a path, no
  # trailing slash. The route (httpRoute) is derived from its path, and the
  # proxy maps that prefix to the server's /mcp.
  readResourceUrl: ""
  # The admin endpoint's URL, the same way (mapped to /mcp-admin). Must differ
  # from readResourceUrl, and neither path may be inside the other.
  adminResourceUrl: ""
  # Advertised in the PRM's scopes_supported and the 401 challenge's scope --
  # never checked. An issuer may refuse an authorize request with no scope at
  # all; "openid" is the one it accepts by default.
  scope: openid

# The resource-proxy sidecars (truvity/sluis, cmd/resource-proxy), both from
# one image. Built by another repository's release, so there is NO default
# version: pin the release you have verified by tag AND digest. Both are
# REQUIRED.
proxy:
  image:
    repository: ghcr.io/truvity/sluis/resource-proxy
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The numeric uid the image runs as. `runAsNonRoot` cannot verify a named
  # user, so the uid is stated.
  runAsUser: 65532
  # Per proxy container (there are two).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# NetworkPolicy: the pod admits ingress on the two proxies' ports from
# `ingressFrom` (the gateway that fronts the server; REQUIRED while enabled,
# an empty list would admit nobody; the default is Envoy Gateway's own pods in
# its default namespace) and egress to DNS, HTTPS (the issuer's signing keys,
# and the Google APIs of a calendar) and the IMAP upstreams. The ops port is
# for the kubelet, whose probes are not subject to a NetworkPolicy.
#
# DNS and HTTPS egress are OPEN BY DEFAULT: port 53 and tcp 443 to any
# destination, because an issuer behind a CDN has no address a chart can know.
# Name the peers in egress.dns and egress.https to close them. `imap` is the
# IMAP upstreams, verbatim egress rules: the default is implicit-TLS IMAP
# (tcp 993, Gmail) to anywhere. `extraEgress` adds rules, verbatim, for what a
# chart cannot know: an in-cluster Proton Bridge (tcp 143 to its pods), and
# the Kubernetes API server (the Lease of leader election: its port and
# address depend on the cluster, e.g. tcp 6443 to the control-plane nodes).
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: envoy}
  egress:
    dns: []
    https: []
    imap:
      - ports:
          - {port: 993, protocol: TCP}
  extraEgress: []

# Optional: ONE gateway.networking.k8s.io/v1 HTTPRoute for both resources, in
# the release namespace, shipped with the Service on purpose (a route whose
# backend arrives later reads BackendNotFound). Per resource, from the path of
# its URL (say /mail): PathPrefix /mail, Exact
# /.well-known/oauth-protected-resource/mail, and Exact
# /mail/.well-known/oauth-protected-resource (rewritten to the second), all to
# that resource's proxy port (read: service.port, admin: service.adminPort).
# No other filter: the proxy maps /mail to /mcp itself.
httpRoute:
  enabled: false
  # Optional: the route's name; defaults to the fullname.
  name: ""
  # Required while enabled. Passed through as written: group, kind, name,
  # namespace, sectionName. Example:
  #   - {group: gateway.networking.k8s.io, kind: Gateway, name: mcp, namespace: envoy-gateway-system, sectionName: https}
  parentRefs: []
  # Optional. When set, the host of both resource URLs must be in it.
  hostnames: []
  annotations: {}
  labels: {}
  # The request timeout on the two MCP rules (not the metadata rules): a live
  # IMAP call against a slow account takes longer than a gateway's default
  # (Envoy: 15s). Cloudflare's proxy gives up on its own after about 100s.
  # Empty omits it.
  timeouts:
    request: 180s
  # An Envoy Gateway BackendTrafficPolicy hashing on Mcp-Session-Id, so a
  # session stays on the pod that answered `initialize` while two pods are
  # Ready during a rolling update. Needs the gateway.envoyproxy.io CRDs: turn
  # it off on another gateway.
  sessionAffinity:
    enabled: true
    headerName: Mcp-Session-Id

# Cache directory: a writable PVC for IMAP cache. In production this should
# be backed up and durable; in development an emptyDir is acceptable.
cache:
  storageClass: nvme
  size: 20Gi

# History directory: an optional PVC for command history.
# When empty (not set), an emptyDir is used and history is discarded on restart.
# In production this should be a durable, backed-up PVC for persistence.
history:
  existingClaim: ""

# Deploys roll with overlap (RollingUpdate, maxSurge 1) when history.existingClaim
# is set; without it the chart uses Recreate. Set forceRecreate: true for the one
# release that bumps the cache schemaVersion (internal/cache/cache.go): the new
# pod drops the index tables the old pod is still using.
forceRecreate: false

# How apply_intent is approved.
#   client:      the client's own tool-approval prompt (capped at 50 messages
#                per apply); the server never elicits.
#   elicitation: the server asks the owner through MCP elicitation forms.
# Default is client: the Claude Code VS Code extension advertises elicitation
# but auto-declines it silently, so every apply would be refused. Switch to
# elicitation once it renders forms (anthropics/claude-code#98978).
approval:
  mode: client

# PDF attachment text. Off by default. mail-mcp contains no PDF parser; when
# enabled, a sidecar container (poppler's pdftotext behind a small helper that
# kills and rlimits every job) extracts the text, and mail-mcp indexes it so
# search finds words inside PDFs. See "PDF attachment text" in the README.
pdfExtractor:
  enabled: false
  image:
    registry: ghcr.io
    repository: excavador/mail-mcp-pdftext
    # Empty means the chart's appVersion (the sidecar is released with mail-mcp).
    tag: ""
    pullPolicy: IfNotPresent
  # Memory is the one that matters: poppler on a hostile file. Two jobs run at
  # once, each with an address-space cap of 400 MB. limits.memory must be at
  # least 464Mi (400 MB plus 64Mi; the chart refuses less): under it the OOM
  # killer takes pdftotext on large files, which looks like a bad file.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}

resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

# Annotations on the DEPLOYMENT, not the pod template. Reloader reads them
# here: an annotation on the pod template looks right and is never seen, so a
# rotated token would sit in a Secret while the pod kept the old one.
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
