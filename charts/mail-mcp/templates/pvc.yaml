apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mail-mcp.fullname" . }}-cache
  labels: {{- include "mail-mcp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.cache.storageClass }}
  resources:
    requests:
      storage: {{ .Values.cache.size }}
