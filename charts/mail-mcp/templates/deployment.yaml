{{- include "mail-mcp.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail-mcp.fullname" . }}
  labels: {{- include "mail-mcp.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate strategy: the cache is a node-local SQLite database and
  # history is an RWO PVC. A rolling update would cause multi-attach
  # errors and concurrent writes to the cache. Only one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "mail-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mail-mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # mail-mcp does not use the Kubernetes API, and a parser sidecar has no
      # business holding a service-account token.
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mail-mcp
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ACCOUNTS_FILE
              value: /etc/mail-mcp/accounts.yaml
            # stdio would exit immediately in a pod with no attached client.
            - name: TRANSPORT
              value: http
            - name: ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: ISSUER_URL
              value: {{ .Values.auth.issuerUrl | quote }}
            - name: READ_RESOURCE_URL
              value: {{ .Values.auth.readResourceUrl | quote }}
            - name: ADMIN_RESOURCE_URL
              value: {{ .Values.auth.adminResourceUrl | quote }}
            - name: SCOPE
              value: {{ .Values.auth.scope | quote }}
            - name: APPROVAL_MODE
              value: {{ .Values.approval.mode | default "client" | quote }}
            # Mount roots are owned by root and ignored by fsGroup. Point to
            # subdirectories the app creates itself with MkdirAll; this lets the
            # app own and chmod them to 0700 as a non-root user (65532).
            - name: CACHE_DIR
              value: /var/cache/mail-mcp/store
            - name: HISTORY_DIR
              value: /var/lib/mail-mcp/history/data
            {{- if .Values.pdfExtractor.enabled }}
            # The PDF sidecar's socket; empty (the default) means no PDF text.
            - name: PDF_EXTRACTOR_SOCKET
              value: /run/pdftext/pdftext.sock
            - name: PDF_STAGE_DIR
              value: /var/lib/mail-mcp/pdf-stage
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # /healthz is liveness only and does NOT call external services:
          # a readiness probe that fails when a dependency blips would take
          # the pod out of service for something it cannot fix by restarting.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: accounts
              mountPath: /etc/mail-mcp
              readOnly: true
            - name: cache
              mountPath: /var/cache/mail-mcp
            - name: history
              mountPath: /var/lib/mail-mcp/history
            - name: tmp
              mountPath: /tmp
            {{- if .Values.pdfExtractor.enabled }}
            - name: pdftext-socket
              mountPath: /run/pdftext
            - name: pdftext-stage
              mountPath: /var/lib/mail-mcp/pdf-stage
            {{- end }}
        {{- if .Values.pdfExtractor.enabled }}
        # PDF text extraction runs here, not in mail-mcp: poppler parses
        # untrusted files, so it gets its own container with no network use,
        # hard limits, and nothing writable but the socket directory. It does
        # not mount the cache volume at all: it sees only the staging
        # emptyDir, where mail-mcp puts one decoded PDF at a time, read-only. The helper kills each pdftotext it starts
        # after 20 s and applies rlimits to it; this container is the second
        # wall (memory limit, no capabilities, seccomp).
        - name: pdftext
          image: "{{ .Values.pdfExtractor.image.registry }}/{{ .Values.pdfExtractor.image.repository }}:{{ .Values.pdfExtractor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.pdfExtractor.image.pullPolicy }}
          args:
            - --socket=/run/pdftext/pdftext.sock
            # Files are at /stage/pdf/<hh>/<sha256>.
            - --root=/stage
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.pdfExtractor.resources | nindent 12 }}
          volumeMounts:
            - name: pdftext-stage
              mountPath: /stage
              readOnly: true
            - name: pdftext-socket
              mountPath: /run/pdftext
        {{- end }}
      volumes:
        - name: accounts
          secret:
            secretName: {{ .Values.accounts.existingSecret }}
            defaultMode: 0400
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "mail-mcp.fullname" . }}-cache
        - name: history
          {{- $h := .Values.history | default dict }}
          {{- if $h.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $h.existingClaim }}
          {{- else }}
          # When history.existingClaim is not set, use an emptyDir.
          # In production, set history.existingClaim to a durable, backed-up PVC.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.pdfExtractor.enabled }}
        - name: pdftext-socket
          emptyDir:
            sizeLimit: 1Mi
        # One decoded PDF (at most 25 MiB) is staged at a time; 64Mi leaves room.
        - name: pdftext-stage
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
