{{- include "mail-mcp.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail-mcp.fullname" . }}
  labels: {{- include "mail-mcp.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate with overlap: the new pod starts and becomes Ready before the
  # old one stops, so MCP clients see no gap. Both pods land on the same node
  # (the cache is a node-local PVC, history an RWO PVC, which several pods on
  # one node may mount) and share both. Requests are safe on both pods (SQLite
  # WAL with a busy timeout, an O_APPEND history file); the background jobs run
  # only in the pod holding the Lease named after this release.
  #
  # Rolling needs history on a shared claim: with the per-pod emptyDir fallback
  # the two pods would each have their own history and undo would break. So no
  # history.existingClaim means Recreate. forceRecreate does the same for a
  # release that bumps the cache schemaVersion (the new pod drops the index
  # tables the old pod is still using).
  {{- $history := .Values.history | default dict }}
  {{- $rolling := and $history.existingClaim (not .Values.forceRecreate) }}
  {{- if $rolling }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "mail-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mail-mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mail-mcp.fullname" . }}
      # Only mail-mcp talks to the Kubernetes API (its Lease), and a parser
      # sidecar has no business holding a service-account token: the token is
      # a projected volume mounted into the mail-mcp container alone.
      automountServiceAccountToken: false
      # SIGTERM: drain requests (20s), stop the jobs, release the Lease.
      terminationGracePeriodSeconds: 45
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mail-mcp
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ACCOUNTS_FILE
              value: /etc/mail-mcp/accounts.yaml
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LEASE_NAME
              value: {{ include "mail-mcp.fullname" . }}
            # stdio would exit immediately in a pod with no attached client.
            - name: TRANSPORT
              value: http
            - name: ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: ISSUER_URL
              value: {{ .Values.auth.issuerUrl | quote }}
            - name: READ_RESOURCE_URL
              value: {{ .Values.auth.readResourceUrl | quote }}
            - name: ADMIN_RESOURCE_URL
              value: {{ .Values.auth.adminResourceUrl | quote }}
            - name: SCOPE
              value: {{ .Values.auth.scope | quote }}
            - name: APPROVAL_MODE
              value: {{ .Values.approval.mode | default "client" | quote }}
            # Mount roots are owned by root and ignored by fsGroup. Point to
            # subdirectories the app creates itself with MkdirAll; this lets the
            # app own and chmod them to 0700 as a non-root user (65532).
            - name: CACHE_DIR
              value: /var/cache/mail-mcp/store
            - name: HISTORY_DIR
              value: /var/lib/mail-mcp/history/data
            {{- if .Values.pdfExtractor.enabled }}
            # The PDF sidecar's socket; empty (the default) means no PDF text.
            - name: PDF_EXTRACTOR_SOCKET
              value: /run/pdftext/pdftext.sock
            - name: PDF_STAGE_DIR
              value: /var/lib/mail-mcp/pdf-stage
            {{- end }}
          # Let the gateway drop this endpoint before shutdown starts.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # /healthz is liveness and readiness, independent of leadership (a new
          # pod is Ready while the old one still leads), and does NOT call
          # external services:
          # a readiness probe that fails when a dependency blips would take
          # the pod out of service for something it cannot fix by restarting.
          # Open can run one-time work before the server listens (the drop of the
          # retired message_fts table, backfill init). Liveness only starts once
          # this passes: up to 10s x 30 = 300s for a first start.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: accounts
              mountPath: /etc/mail-mcp
              readOnly: true
            - name: cache
              mountPath: /var/cache/mail-mcp
            - name: history
              mountPath: /var/lib/mail-mcp/history
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if .Values.pdfExtractor.enabled }}
            - name: pdftext-socket
              mountPath: /run/pdftext
            - name: pdftext-stage
              mountPath: /var/lib/mail-mcp/pdf-stage
            {{- end }}
        {{- if .Values.pdfExtractor.enabled }}
        # PDF text extraction runs here, not in mail-mcp: poppler parses
        # untrusted files, so it gets its own container with no network use,
        # hard limits, and nothing writable but the socket directory. It does
        # not mount the cache volume at all: it sees only the staging
        # emptyDir, where mail-mcp puts one decoded PDF at a time, read-only. The helper kills each pdftotext it starts
        # after 20 s and applies rlimits to it; this container is the second
        # wall (memory limit, no capabilities, seccomp).
        - name: pdftext
          image: "{{ .Values.pdfExtractor.image.registry }}/{{ .Values.pdfExtractor.image.repository }}:{{ .Values.pdfExtractor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.pdfExtractor.image.pullPolicy }}
          args:
            - --socket=/run/pdftext/pdftext.sock
            # Files are at /stage/pdf/<hh>/<sha256>.
            - --root=/stage
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.pdfExtractor.resources | nindent 12 }}
          volumeMounts:
            - name: pdftext-stage
              mountPath: /stage
              readOnly: true
            - name: pdftext-socket
              mountPath: /run/pdftext
        {{- end }}
      volumes:
        - name: accounts
          secret:
            secretName: {{ .Values.accounts.existingSecret }}
            defaultMode: 0400
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "mail-mcp.fullname" . }}-cache
        - name: history
          {{- $h := .Values.history | default dict }}
          {{- if $h.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $h.existingClaim }}
          {{- else }}
          # When history.existingClaim is not set, use an emptyDir.
          # In production, set history.existingClaim to a durable, backed-up PVC.
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]
        {{- if .Values.pdfExtractor.enabled }}
        - name: pdftext-socket
          emptyDir:
            sizeLimit: 1Mi
        # One decoded PDF (at most 25 MiB) is staged at a time; 64Mi leaves room.
        - name: pdftext-stage
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $aff := .Values.affinity | default dict | deepCopy }}
      {{- if and $rolling (not $aff.podAffinity) }}
      {{- /* The surge pod must land on the old pod's node (shared cache and
             history); a pod may match its own selector when it is the first. */}}
      {{- $_ := set $aff "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (include "mail-mcp.selectorLabels" . | fromYaml))))) }}
      {{- end }}
      {{- with $aff }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
