{{- if .Values.networkPolicy.enabled }}
{{- /*
The pod admits the gateway on the two proxies' ports and nothing else (the
ops port is for the kubelet, whose probes are not subject to a NetworkPolicy),
and reaches DNS, HTTPS (the issuer's signing keys; the Google APIs), the IMAP
upstreams and whatever extraEgress adds. Policies are additive: other
policies selecting this pod add to these rules.
*/}}
{{- $httpsPorts := uniq (list "443" (include "mail-mcp.urlPort" .Values.auth.issuerUrl)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mail-mcp.fullname" . }}
  labels: {{- include "mail-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mail-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The gateway, on the proxies' MCP ports.
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: {{ include "mail-mcp.readProxyPort" . }}
          protocol: TCP
        - port: {{ include "mail-mcp.adminProxyPort" . }}
          protocol: TCP
  egress:
    # DNS. With no networkPolicy.egress.dns peers this is port 53 to ANY
    # destination: the cluster resolver is not a kube-system pod on every
    # cluster, and a rule naming one namespace blocks DNS where it is not.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.egress.dns }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    # HTTPS: the issuer (both proxies fetch its signing keys), and the Google
    # APIs of a calendar. Any destination unless networkPolicy.egress.https
    # names peers: the issuer sits behind addresses that change.
    - ports:
        {{- range $p := $httpsPorts }}
        - port: {{ $p }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.egress.https }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.egress.imap }}
    # The IMAP upstreams, verbatim.
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
